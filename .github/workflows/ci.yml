name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  go:
    name: go ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        module: [control-plane, data-plane]
    defaults:
      run:
        working-directory: ${{ matrix.module }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: ${{ matrix.module }}/go.mod
          cache-dependency-path: ${{ matrix.module }}/go.sum
      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then echo "not gofmt'ed:"; echo "$unformatted"; exit 1; fi
      - run: go vet ./...
      - run: go test -race -count=1 ./...
      - run: go build ./...

  stack:
    name: docker stack smoke test
    runs-on: ubuntu-latest
    needs: go
    steps:
      - uses: actions/checkout@v4
      - name: Build and start control plane and worker
        run: docker compose up -d --build --wait control-plane
      - name: Smoke test
        run: bash tests/smoke_test.sh
      - name: Start a worker and run a job end to end
        run: |
          docker compose up -d worker
          bash tests/e2e_job.sh
      - name: Logs
        if: always()
        run: docker compose logs --no-color | tail -200
      - if: always()
        run: docker compose down -v
