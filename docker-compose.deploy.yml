# Control plane from the prebuilt GHCR image (no build on the host).
#   docker compose -f docker-compose.deploy.yml pull && docker compose -f docker-compose.deploy.yml up -d
# Pin a release with PROCESSOR_TAG=sha-abc1234 (default: main). Settings come from .env.
# Port 8080 binds to localhost only: put a reverse proxy (Caddy/nginx) in front. PROCESSOR_BIND=0.0.0.0 exposes it.
services:
  control-plane:
    image: ghcr.io/realsystem/processor-control-plane:${PROCESSOR_TAG:-main}
    container_name: processor-control-plane
    ports:
      - "${PROCESSOR_BIND:-127.0.0.1}:8080:8080"
    environment:
      - DATABASE_PATH=/data/processor.db
      - SESSION_SECRET=${SESSION_SECRET}
      - WORKER_TOKEN=${WORKER_TOKEN:-}
      - WORKER_AUTH=${WORKER_AUTH:-signature}
      - HTTP_PORT=8080
      - ENV=${ENV:-production}
      - ADMIN_EMAIL=${ADMIN_EMAIL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - LEASE_DURATION=${LEASE_DURATION:-5m}
      - LLM_MODELS=${LLM_MODELS:-}
      - LLM_DEFAULT_MODEL=${LLM_DEFAULT_MODEL:-}
    volumes:
      - processor-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:8080/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # Optional Telegram front end: docker compose -f docker-compose.deploy.yml --profile telegram up -d
  # Needs TELEGRAM_BOT_TOKEN, TELEGRAM_ALLOWED_USERS and PROCESSOR_API_KEY in .env (docs/telegram-bot.md).
  telegram-bot:
    profiles: ["telegram"]
    image: ghcr.io/realsystem/processor-control-plane:${PROCESSOR_TAG:-main}
    container_name: processor-telegram-bot
    command: ["./telegram-bot"]
    environment:
      - PROCESSOR_URL=http://control-plane:8080
      - PROCESSOR_API_KEY=${PROCESSOR_API_KEY:-}
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      - TELEGRAM_ALLOWED_USERS=${TELEGRAM_ALLOWED_USERS:-}
      - BOT_DEFAULT_MODEL=${BOT_DEFAULT_MODEL:-}
      - BOT_JOB_TIMEOUT=${BOT_JOB_TIMEOUT:-15m}
    depends_on:
      control-plane:
        condition: service_healthy
    healthcheck:
      disable: true # the image's health check probes the control plane's port
    restart: unless-stopped

volumes:
  processor-data:
