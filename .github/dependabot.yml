# Weekly update PRs for dependencies and GitHub Actions; security updates arrive on top of these.
# Only what ships or builds for real is listed: lab and test images stay out so the PR list stays short.
# Merge them like any other PR: CI runs first.
version: 2
updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    groups:
      all: {patterns: ["*"]}
  - package-ecosystem: "gomod"
    directory: "/control-plane"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Newer releases need a Go toolchain newer than the golang:1.25 image the Dockerfiles use.
      - dependency-name: "golang.org/x/crypto"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "gomod"
    directory: "/data-plane"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
    ignore:
      # Newer releases need a Go toolchain newer than the golang:1.25 image the Dockerfiles use.
      - dependency-name: "golang.org/x/time"
        update-types: ["version-update:semver-minor"]
  - package-ecosystem: "docker"
    directory: "/control-plane"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
  - package-ecosystem: "docker"
    directory: "/data-plane"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 3
